_schema-version: 3.3.0
ID: sales-app
description: A simple CAP project.
version: 1.0.0
modules:
- name: sales-app-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: sales-app-auth
  - name: sales-app-db
  - name: sales-app-connectivity
  - name: sales-app-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: sales-app-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: sales-app-db
  parameters:
    buildpack: nodejs_buildpack
- name: sales-app
  type: approuter.nodejs
  path: .deploy/app-router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: sales-app-auth
  - name: sales-app-destination
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: sales-app-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: sales-app-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - salesorderssalesorderapp1.zip
      name: salesorderssalesorderapp1
      target-path: resources/
    - artifacts:
      - customerscustomersapp.zip
      name: customerscustomersapp
      target-path: resources/
    - artifacts:
      - productsproducts.zip
      name: productsproducts
      target-path: resources/
    - artifacts:
      - productsproductsapp.zip
      name: productsproductsapp
      target-path: resources/
    - artifacts:
      - salesorderssalesorderapp.zip
      name: salesorderssalesorderapp
      target-path: resources/
- name: salesorderssalesorderapp1
  type: html5
  path: app/salesorder-app1
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: customerscustomersapp
  type: html5
  path: app/customersapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: productsproducts
  type: html5
  path: app/products
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: productsproductsapp
  type: html5
  path: app/productsapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: salesorderssalesorderapp
  type: html5
  path: app/salesorderapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: sales-app-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
        redirect-uris:
        - https://*~{app-api/app-uri}/**
      tenant-mode: dedicated
      xsappname: sales-app-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
  requires:
  - name: app-api
- name: sales-app-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: sales-app-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: sales-app-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: sales-app-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: sales-app-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
